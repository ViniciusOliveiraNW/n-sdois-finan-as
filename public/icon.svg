<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f9ff"/>
      <stop offset="100%" stop-color="#e6f4ea"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0b1c30" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background with subtle corner rounding -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#d0e1d4" stroke-width="6"/>

  <g filter="url(#shadow)">
    <!-- Círculo Azul (Parceiro 1 / Vinicius) -->
    <circle cx="210" cy="256" r="120" stroke="#0051d5" stroke-width="40" fill="none" opacity="0.95"/>
    <!-- Círculo Violeta (Parceiro 2 / Silvia) -->
    <circle cx="302" cy="256" r="120" stroke="#712ae2" stroke-width="40" fill="none" opacity="0.95"/>
    <!-- Sinal de soma / parceria verde no centro -->
    <path d="M256 200 V312 M200 256 H312" stroke="#006948" stroke-width="28" stroke-linecap="round"/>
  </g>
</svg>
